# Importa la raíz del repositorio como Blueprint en Render.
services:
  - type: web
    name: guia-fit
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: AUTO_MIGRATE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
